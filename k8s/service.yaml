apiVersion: v1
kind: Service
metadata:
  name: fraud-api-service
  namespace: mlops-fraud
  labels:
    app.kubernetes.io/name: fraud-api
  annotations:
    # GKE Container-Native Load Balancing via Network Endpoint Groups (NEG)
    cloud.google.com/neg: '{"ingress": true}'
    # GKE BackendConfig for Google Cloud Load Balancer health checking & timeouts
    cloud.google.com/backend-config: '{"default": "fraud-api-backendconfig"}'
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: fraud-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
