apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: fraud-api-backendconfig
  namespace: mlops-fraud
  labels:
    app.kubernetes.io/name: fraud-api
spec:
  timeoutSec: 30
  connectionDraining:
    drainingTimeoutSec: 30
  healthCheck:
    type: HTTP
    requestPath: /health/ready
    port: 8000
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 2
    unhealthyThreshold: 3

