apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fraud-api-ingress
  namespace: mlops-fraud
  annotations:
    kubernetes.io/ingress.class: "gce"
    # Optional: Reserve a static external IP in GCP and uncomment the line below
    # kubernetes.io/ingress.global-static-ip-name: "fraud-api-static-ip"
spec:
  rules:
    - http:
        paths:
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: fraud-api-service
                port:
                  number: 80
